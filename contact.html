<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="recommendations.html">Recommendations</a></li>
        </ul>
    </nav>
    <h1>Contact Form</h1>
     <div class="gif">
        <iframe src="crabby.gif" alt="typing keyboard gif" width="300" height="300"></iframe>
    </div>
    <section class="contacts">
        <p>Name (First + Last): </p>
        <input required placeholder="Gerald Butler">
    </section>
    <section class="contacts">
        <p>Email Address: </p>
        <input required placeholder="hello@gmail.com">
    </section>
    <form class="contacts">
        <label>Gender?</label><br>
        <input type="radio" name="gender">Female<br>
        <input type="radio" name="gender">Male<br>
        <input type="radio" name="gender">Non Binary<br>
        <input type="radio" name="gender">Prefer Not to Say<br>
    </form>
    <section class="contacts">
        <p>Question/Comments</p>
        <textarea rows="5" class="questions" required placeholder="Answer here"></textarea>
    </section>

    <form class="contacts">
        <label>Level of Importance</label>
        <select>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
            <option>None</option>
        </select>
    </form>

    <button class="submit" >Submit</button>

   
    

</body>

<footer class="footer">
    <p>Navigate to other pages to learn more about me!</p>
</footer>
